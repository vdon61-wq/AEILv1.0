name: aeil-validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  consistency:
    name: Repository consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # needed: validate_repo.py checks tags/releases

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install validation dependencies
        run: python -m pip install --upgrade pip jsonschema

      - name: Repository consistency (manifest, licences, placeholders, schemas)
        run: |
          mkdir -p build
          python tools/validate_repo.py --repo . --json build/validation.json
        continue-on-error: true

      - name: Benchmark statistical health
        run: python tools/aeil_score.py audit-benchmark --repo .
        continue-on-error: true

      - name: Validate benchmark suites against protocol/aeil-test.schema.json
        run: |
          python - <<'PY'
          import json, pathlib, sys
          from jsonschema import Draft202012Validator
          from referencing import Registry, Resource

          proto = pathlib.Path("protocol")
          resources = []
          for schema_file in sorted(proto.glob("*.schema*.json")):
              schema = json.loads(schema_file.read_text(encoding="utf-8"))
              if "$id" in schema:
                  resources.append((schema["$id"], Resource.from_contents(schema)))
              resources.append((schema_file.name, Resource.from_contents(schema)))
          registry = Registry().with_resources(resources)

          test_schema_path = proto / "aeil-test.schema.json"
          if not test_schema_path.exists():
              print("::warning::protocol/aeil-test.schema.json missing - suite validation skipped")
              sys.exit(0)
          validator = Draft202012Validator(
              json.loads(test_schema_path.read_text(encoding="utf-8")), registry=registry)

          errors = 0
          for suite in sorted(pathlib.Path("benchmark").glob("*/tests.json")):
              data = json.loads(suite.read_text(encoding="utf-8"))
              tests = data.get("tests", data if isinstance(data, list) else [])
              if data.get("count") is not None and data["count"] != len(tests):
                  print(f"::error file={suite}::count={data['count']} but {len(tests)} tests")
                  errors += 1
              for t in tests:
                  for e in validator.iter_errors(t):
                      loc = "/".join(map(str, e.path)) or "<root>"
                      print(f"::error file={suite}::{t.get('test_id','?')} {loc}: {e.message}")
                      errors += 1
              print(f"{suite}: {len(tests)} cases validated")
          sys.exit(1 if errors else 0)
          PY

      - name: Schema regression tests (report gates, vacuous-if guards, shipped examples)
        run: python tools/test_schemas.py

      - name: Scorer smoke test (synthetic results must produce a schema-valid report)
        run: |
          mkdir -p build
          python tools/make_demo_results.py . build/demo-results.json
          python tools/aeil_score.py score --repo . --results build/demo-results.json \
            --out build/demo-report.json || true
          test -s build/demo-report.json

      - name: Summary
        if: always()
        run: |
          echo "### Validation artefacts" >> "$GITHUB_STEP_SUMMARY"
          if [ -f build/validation.json ]; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, collections
          rows = json.load(open("build/validation.json", encoding="utf-8"))
          c = collections.Counter(r["severity"] for r in rows)
          print("| severity | count |")
          print("|---|---:|")
          for k in ("Critical", "High", "Medium", "Low", "Info"):
              if c.get(k):
                  print(f"| {k} | {c[k]} |")
          print()
          for r in rows:
              if r["severity"] in ("Critical", "High"):
                  print(f"- **{r['severity']}** `{r['rule']}` {r['message']} `{r.get('path','')}`")
          PY
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aeil-validation
          path: build/
          if-no-files-found: ignore

  gates:
    name: Blocking gates
    runs-on: ubuntu-latest
    needs: consistency
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Fail on Critical/High findings
        run: python tools/validate_repo.py --repo .
